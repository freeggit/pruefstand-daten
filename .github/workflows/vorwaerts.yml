name: Prüfstand Vorwärtsregister
# V3.15 (E32): tägliches Handelsbuch der registrierten Stränge (explorativ). Der Signalrechner erhält gekürzte Kurse;
# Erträge rechnet nur die einmalige Schlussauswertung eines Strangs nach seinem Schlusstag (im selben Lauf, ohne Schalter).
# Freigabemodus: vorwaerts/freigabe.json (fehlt die Datei: gesperrt).
on:
  schedule:
    - cron: "10 4 * * *"         # nach Strom (02:30 UTC) und Datenspiegel (03:15 UTC), vor der Suche (05:00 UTC)
    - cron: "10 11 * * *"        # zweiter Lauf vor der Eröffnung der US-Börse (13:30 UTC)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["vorwaerts/**", "vorwaerts.py", ".github/workflows/vorwaerts.yml"]
permissions:
  contents: write
concurrency:
  group: vorwaerts               # eigene Gruppe: wartet nicht auf die Suche und verdrängt keinen wartenden Lauf;
  cancel-in-progress: false      # vorwaerts.py veröffentlicht selbst: holt claude/lernen, prüft die Anhängeregel, setzt den eigenen Stand dahinter
jobs:
  vorwaerts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }   # V3.15: Zeitpunkt des Commits der Registrierung und der festgelegte Code brauchen die Historie
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Pakete
        run: pip install -q numpy==2.5.3 pandas==3.0.6     # feste Versionen: eine reservierte Schlussauswertung wird nur mit denselben fortgesetzt
      - name: Zweige holen
        run: |
          for z in daten-energie daten-neu lernen; do
            if git ls-remote --exit-code --heads origin claude/$z >/dev/null 2>&1; then
              if [ "$z" = "lernen" ]; then git fetch -q origin claude/$z:refs/remotes/origin/claude/$z
              else git fetch -q --depth 1 origin claude/$z:refs/remotes/origin/claude/$z; fi
              git worktree add -q --detach _$z origin/claude/$z
              echo "claude/$z: $(git -C _$z log -1 --format='%h %ci')"
            else
              echo "Zweig claude/$z fehlt"
            fi
          done
          test -d _lernen
      - name: Tests (bei Push; unabhängig vom Freigabemodus)
        if: github.event_name == 'push'
        run: python test_vorwaerts.py
        timeout-minutes: 5
      - name: Handelsbuch fortschreiben
        id: logbuch
        run: |
          export PS_VORWAERTS_STAND="main=$(git rev-parse HEAD);neu=$(git -C _daten-neu rev-parse HEAD 2>/dev/null);energie=$(git -C _daten-energie rev-parse HEAD 2>/dev/null)"
          python vorwaerts.py
        env:
          PS_CACHE: /tmp/vorwaerts-cache
        timeout-minutes: 15
      - name: Veröffentlichen (nur vorwaerts/, streng anhängend; danach Vermerk der Zeit nach dem Push)
        id: push
        if: always()
        run: python vorwaerts.py veroeffentliche
        timeout-minutes: 5
      - name: Bergung (lokale Journale sichern, wenn Lauf oder Veröffentlichung scheitert)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vorwaerts-bergung-${{ github.run_id }}
          path: _lernen/vorwaerts/
          if-no-files-found: ignore
          retention-days: 90
