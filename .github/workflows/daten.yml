name: Prüfstand Datenspiegel
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["fetch.py", "fetch_hr.py", "tickers.txt", "fred_series.txt", ".github/workflows/daten.yml"]
permissions:
  contents: write
concurrency:
  group: spiegel
  cancel-in-progress: false
jobs:
  spiegel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Kurse, FRED, Ken French
        run: python fetch.py
        timeout-minutes: 10
      - name: Hochaufgelöste Reihen
        run: python fetch_hr.py
        env:
          HR_TEILE: pegel,wiki,wetter   # Strom kommt über die Claude-Code-Routine (Zweig claude/daten-energie)
        timeout-minutes: 30
        continue-on-error: true
      - name: Manifest sichern
        if: always()
        run: python fetch_hr.py --manifest
      - name: Einchecken
        if: always()
        run: |
          git config user.name "pruefstand-bot"
          git config user.email "pruefstand-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          git commit -m "Datenspiegel $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1
