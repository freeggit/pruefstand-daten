name: Prüfstand Suche
# V3.4 (E9): Suchlauf in der GitHub Action statt in der Routine. Ergebnis auf dem Zweig claude/lernen.
on:
  schedule:
    - cron: "0 5 * * *"          # täglich 07:00 Sommerzeit, nach Datenspiegel (03:15 UTC) und Strom (02:30 UTC)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["suchmaschine.py", "suche_lauf.py", "paare.txt", "mechanismen.txt", "siegel_test.py", "analyse.py", "vorreg.py", ".github/workflows/suche.yml"]
permissions:
  contents: write
concurrency:
  group: suche
  cancel-in-progress: false
jobs:
  suche:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Pakete
        run: pip install -q numpy pandas
      - name: Zweige holen
        run: |
          for z in daten-energie daten-neu lernen; do
            if git ls-remote --exit-code --heads origin claude/$z >/dev/null 2>&1; then
              if [ "$z" = "lernen" ]; then git fetch -q origin claude/$z:refs/remotes/origin/claude/$z
              else git fetch -q --depth 1 origin claude/$z:refs/remotes/origin/claude/$z; fi
              git worktree add -q --detach _$z origin/claude/$z
              echo "claude/$z: $(git -C _$z log -1 --format='%h %ci')"
            else
              echo "Zweig claude/$z fehlt"
            fi
          done
          if [ ! -d _lernen ]; then
            git worktree add -q --detach _lernen HEAD
            cd _lernen && git checkout -q --orphan lernen-neu && git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
      - name: Siegeltest (nur bei Code-Änderung)
        if: github.event_name == 'push'
        run: python siegel_test.py
        timeout-minutes: 30
      - name: Suchlauf
        run: python suche_lauf.py
        env:
          PS_PLACEBO: "200"
        timeout-minutes: 200
      - name: Analyse (Stufe 1 und 4, 50 Profile, 50 Placebo-Simulationen; V3.10)
        run: python analyse.py
        env:
          PS_CACHE: /tmp/lauf/cache
          PS_LAUF: /tmp/lauf
        timeout-minutes: 60
        continue-on-error: true
      - name: Vorregistrierte Hypothesen (Familie V, V3.10 E23; nur wartende Chargen)
        run: python vorreg.py
        env:
          PS_CACHE: /tmp/lauf/cache
        timeout-minutes: 30
        continue-on-error: true
      - name: Einchecken auf claude/lernen
        # einchecken.py: holt claude/lernen mit explizitem Ziel und mischt index.json dreiweg (30.9.2026, Lauf #18)
        run: python einchecken.py "Suchlauf"
